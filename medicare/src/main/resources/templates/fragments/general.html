<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">MediCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar"
     class="navbar navbar-dark bg-primary shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/inicio}">
            MediCare
        </a>

        <form th:action="@{/logout}" method="post">
            <button class="btn btn-light btn-sm">
                Cerrar Sesión
            </button>
        </form>

    </div>

</nav>

<footer th:fragment="footer"
        class="border-top bg-light text-center py-3 mt-5">

    <div class="container">
        <span class="text-muted">
            MediCare - Sistema de Citas Médicas
        </span>
    </div>

</footer>

</body>
</html>
