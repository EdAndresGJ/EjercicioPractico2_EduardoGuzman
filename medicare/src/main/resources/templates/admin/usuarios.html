<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/general :: head('Usuarios')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments/general :: navbar}"></nav>

<div class="container py-5">

    <h2>Usuarios</h2>

    <a th:href="@{/admin/inicio}" class="btn btn-secondary mb-3">
        Volver
    </a>

    <table class="table table-striped table-bordered bg-white">

        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Activo</th>
            <th>Acción</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nombre}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.rol.nombre}"></td>
            <td th:text="${usuario.activo}"></td>
            <td>
                <a th:href="@{/admin/usuarios/eliminar/{id}(id=${usuario.id})}"
                   class="btn btn-danger btn-sm">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>

    </table>

</div>

<footer th:replace="~{fragments/general :: footer}"></footer>

</body>
</html>
