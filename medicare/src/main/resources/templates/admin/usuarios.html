<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/general :: head('Usuarios - MediCare')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments/general :: navbar}"></nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">Usuarios</h2>
            <p class="text-muted mb-0">
                Administración de usuarios de MediCare.
            </p>
        </div>

        <a th:href="@{/admin/usuarios/nuevo}"
           class="btn btn-primary">
            Nuevo Usuario
        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <table class="table table-striped align-middle">

                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.id}"></td>

                    <td th:text="${usuario.nombre}"></td>

                    <td th:text="${usuario.email}"></td>

                    <td th:text="${usuario.rol.nombre}"></td>

                    <td>
                        <span th:if="${usuario.activo}"
                              class="badge bg-success">
                            Activo
                        </span>

                        <span th:unless="${usuario.activo}"
                              class="badge bg-secondary">
                            Inactivo
                        </span>
                    </td>

                    <td>

                        <a th:href="@{/admin/usuarios/editar/{id}(id=${usuario.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a th:href="@{/admin/usuarios/eliminar/{id}(id=${usuario.id})}"
                           class="btn btn-danger btn-sm">
                            Eliminar
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <a th:href="@{/admin/inicio}"
               class="btn btn-secondary">
                Volver
            </a>

        </div>

    </div>

</div>

<footer th:replace="~{fragments/general :: footer}"></footer>

</body>
</html>
