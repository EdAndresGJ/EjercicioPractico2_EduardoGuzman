<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/general :: head('Citas')}"></head>

<body class="bg-light">

<nav th:replace="~{fragments/general :: navbar}"></nav>

<div class="container py-5">

    <h2>Citas Médicas</h2>

    <a th:href="@{/admin/inicio}" class="btn btn-secondary mb-3">
        Volver
    </a>

    <table class="table table-striped table-bordered bg-white">

        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Paciente</th>
            <th>Especialidad</th>
            <th>Fecha</th>
            <th>Costo</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="cita : ${citas}">
            <td th:text="${cita.id}"></td>
            <td th:text="${cita.paciente.nombre}"></td>
            <td th:text="${cita.especialidad}"></td>
            <td th:text="${cita.fechaHora}"></td>
            <td th:text="${cita.costo}"></td>
            <td th:text="${cita.estado}"></td>
            <td>
                <a th:href="@{/admin/citas/eliminar/{id}(id=${cita.id})}"
                   class="btn btn-danger btn-sm">
                    Eliminar
                </a>
            </td>
        </tr>
        </tbody>

    </table>

</div>

<footer th:replace="~{fragments/general :: footer}"></footer>

</body>
</html>
